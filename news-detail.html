<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новость - ABU</title>
    <link rel="stylesheet" href="css/erasmus+circulen.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <style>
        .news-detail-page {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .news-detail-header {
            margin-bottom: 2rem;
        }
        .news-detail-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        .news-detail-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #7f8c8d;
            margin-bottom: 2rem;
        }
        .news-detail-image {
            width: 100%;
            margin-bottom: 2rem;
        }
        .news-detail-image img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .news-detail-description {
            font-size: 1.3rem;
            color: #34495e;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .news-detail-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #2c3e50;
            white-space: pre-wrap;
        }
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 12px 24px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #7f8c8d;
        }
        .loading i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #3498db;
        }
        .error {
            text-align: center;
            padding: 4rem 2rem;
            color: #e74c3c;
        }
        .error i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .translation-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            align-items: center;
        }
        .translation-btn {
            padding: 8px 16px;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: #495057;
            transition: all 0.3s ease;
            min-width: 50px;
            text-align: center;
        }
        .translation-btn:hover {
            background: #e9ecef;
            border-color: #3498db;
            color: #3498db;
        }
        .translation-btn.active {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-color: #3498db;
            color: white;
        }
        .translation-label {
            margin-right: 0.5rem;
            color: #6c757d;
            font-weight: 500;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="content">
            <!-- Навигация -->
            <div class="menu">
                <div class="container">
                    <div class="menu__row">
                        <div class="logo__title">
                            <a href="index.html">
                                <img class="menu__logo" src="img/Logo-ABU.png" alt="ABU-logo">
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Контент новости -->
            <div class="news-detail-page">
                <a href="erasmus+circulen.html" class="back-button">
                    <i class="fas fa-arrow-left"></i>
                    Назад к новостям
                </a>
                
                <div id="newsDetailContent">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Загрузка новости...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/language-switcher.js"></script>
    
    <script>
        // Глобальная переменная для хранения данных новости
        let currentNewsData = null;
        let currentLanguage = 'RU'; // По умолчанию русский

        // Функция загрузки языка из localStorage
        function loadLanguage() {
            const savedLanguage = localStorage.getItem('newsLanguage');
            return savedLanguage && ['RU', 'KZ', 'EN'].includes(savedLanguage) ? savedLanguage : 'RU';
        }

        // Функция сохранения языка в localStorage
        function saveLanguage(lang) {
            localStorage.setItem('newsLanguage', lang);
        }

        // Функция форматирования даты
        function formatDate(dateString, lang = 'RU') {
            const date = new Date(dateString);
            const locales = {
                'RU': 'ru-RU',
                'EN': 'en-US',
                'KZ': 'kk-KZ'
            };
            return date.toLocaleDateString(locales[lang] || 'ru-RU', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Функция отображения новости с учетом языка
        function renderNews(newsData, contentData, lang) {
            const title = contentData[`title_${lang.toLowerCase()}`] || contentData.title_ru || newsData.title;
            const description = contentData[`description_${lang.toLowerCase()}`] || contentData.description || '';
            // Используем content_ru/content_en/content_kz, если есть, иначе fallback на main
            const mainContent = contentData[`content_${lang.toLowerCase()}`] || contentData.main || '';

            // Тексты для кнопок и метаданных
            const texts = {
                RU: {
                    back: 'Назад к новостям',
                    calendar: 'Календарь',
                    user: 'Пользователь',
                    loading: 'Загрузка новости...',
                    error: 'Ошибка загрузки новости',
                    notFound: 'Новость не найдена'
                },
                EN: {
                    back: 'Back to news',
                    calendar: 'Calendar',
                    user: 'User',
                    loading: 'Loading news...',
                    error: 'Error loading news',
                    notFound: 'News not found'
                },
                KZ: {
                    back: 'Жаңалықтарға оралу',
                    calendar: 'Күнтізбе',
                    user: 'Пайдаланушы',
                    loading: 'Жаңалық жүктелуде...',
                    error: 'Жаңалықты жүктеу қатесі',
                    notFound: 'Жаңалық табылмады'
                }
            };

            const t = texts[lang] || texts.RU;

            return `
                <div class="translation-buttons">
                    <span class="translation-label">Язык:</span>
                    <button class="translation-btn ${lang === 'RU' ? 'active' : ''}" data-lang="RU" onclick="switchNewsLanguage('RU')">RU</button>
                    <button class="translation-btn ${lang === 'KZ' ? 'active' : ''}" data-lang="KZ" onclick="switchNewsLanguage('KZ')">KZ</button>
                    <button class="translation-btn ${lang === 'EN' ? 'active' : ''}" data-lang="EN" onclick="switchNewsLanguage('EN')">EN</button>
                </div>
                <article class="news-detail">
                    <header class="news-detail-header">
                        <h1 class="news-detail-title">${escapeHtml(title)}</h1>
                        <div class="news-detail-meta">
                            <span><i class="fas fa-calendar"></i> ${formatDate(contentData.date || newsData.created_at, lang)}</span>
                            <span><i class="fas fa-user"></i> ${newsData.author || 'Admin'}</span>
                        </div>
                    </header>
                    
                    ${newsData.image_url ? `
                    <div class="news-detail-image">
                        <img src="${newsData.image_url}" alt="${escapeHtml(title)}">
                    </div>
                    ` : ''}
                    
                    <div class="news-detail-content">
                        ${description ? `
                        <div class="news-detail-description">
                            ${escapeHtml(description).replace(/\n/g, '<br>')}
                        </div>
                        ` : ''}
                        
                        <div class="news-detail-text">
                            ${escapeHtml(mainContent).replace(/\n/g, '<br>')}
                        </div>
                    </div>
                </article>
            `;
        }

        // Функция экранирования HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Функция переключения языка
        function switchNewsLanguage(lang) {
            if (!currentNewsData) return;
            
            currentLanguage = lang;
            saveLanguage(lang);
            
            // Парсим contentData
            let contentData = {};
            try {
                contentData = typeof currentNewsData.content === 'string' 
                    ? JSON.parse(currentNewsData.content) 
                    : currentNewsData.content;
            } catch (e) {
                contentData = { main: currentNewsData.content || '', description: '' };
            }

            // Обновляем отображение
            const content = document.getElementById('newsDetailContent');
            if (content) {
                content.innerHTML = renderNews(currentNewsData, contentData, lang);
            }

            // Обновляем title страницы
            const title = contentData[`title_${lang.toLowerCase()}`] || contentData.title_ru || currentNewsData.title;
            document.title = `${title} - ABU`;
        }

        // Загружаем новость по ID из URL параметров
        async function loadNewsDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const newsId = urlParams.get('id');
            
            if (!newsId) {
                document.getElementById('newsDetailContent').innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h2>Новость не найдена</h2>
                        <p>Не указан ID новости в URL</p>
                    </div>
                `;
                return;
            }

            try {
                // Проверяем инициализацию Supabase
                if (typeof supabase === 'undefined' || !supabase) {
                    throw new Error('Supabase не инициализирован');
                }

                console.log('Загрузка новости с ID:', newsId);
                
                // Загружаем новость из Supabase
                const { data, error } = await supabase
                    .from('news')
                    .select('*')
                    .eq('id', newsId)
                    .single();

                if (error) {
                    throw error;
                }

                if (!data) {
                    throw new Error('Новость не найдена');
                }

                console.log('Новость загружена:', data);

                // Сохраняем данные новости глобально
                currentNewsData = data;

                // Загружаем сохраненный язык
                currentLanguage = loadLanguage();

                // Парсим JSON из content
                let contentData = {};
                try {
                    contentData = typeof data.content === 'string' ? JSON.parse(data.content) : data.content;
                } catch (e) {
                    contentData = { main: data.content || '', description: '' };
                }

                // Отображаем новость
                const content = document.getElementById('newsDetailContent');
                if (content) {
                    content.innerHTML = renderNews(data, contentData, currentLanguage);
                }

                // Обновляем title страницы
                const title = contentData[`title_${currentLanguage.toLowerCase()}`] || contentData.title_ru || data.title;
                document.title = `${title} - ABU`;

            } catch (error) {
                console.error('Ошибка загрузки новости:', error);
                document.getElementById('newsDetailContent').innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h2>Ошибка загрузки новости</h2>
                        <p>${error.message || 'Не удалось загрузить новость'}</p>
                    </div>
                `;
            }
        }

        // Запускаем загрузку после инициализации Supabase
        document.addEventListener('DOMContentLoaded', async () => {
            // Ждём инициализации Supabase
            let attempts = 0;
            const checkSupabase = setInterval(() => {
                attempts++;
                if (typeof supabase !== 'undefined' && supabase) {
                    clearInterval(checkSupabase);
                    loadNewsDetail();
                } else if (attempts > 30) {
                    clearInterval(checkSupabase);
                    document.getElementById('newsDetailContent').innerHTML = `
                        <div class="error">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h2>Ошибка инициализации</h2>
                            <p>Не удалось подключиться к Supabase</p>
                        </div>
                    `;
                }
            }, 100);
        });
    </script>
</body>
</html>
