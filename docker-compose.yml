version: '3.8'

services:
  web:
    build: .
    container_name: abu-website
    ports:
      - "3000:80"
    restart: unless-stopped
    volumes:
      # Опционально: для разработки можно монтировать код
      # - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

