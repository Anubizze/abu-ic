server {
    listen 80;
    server_name localhost;

    # Увеличиваем лимит размера загружаемых файлов до 100MB
    client_max_body_size 100M;
    client_body_buffer_size 100M;

    # Нужно для proxy_pass на HTTPS домены (Cloudflare Workers)
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Основная локация
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to Cloudflare Worker для загрузок в R2 (CORS-safe, same-origin)
    # R2_CONFIG.WORKER_URL по умолчанию = /api/r2-upload
    location = /api/r2-upload {
        return 301 /api/r2-upload/;
    }

    location /api/r2-upload/ {
        # Увеличиваем лимит для загрузки файлов через прокси
        client_max_body_size 100M;
        client_body_buffer_size 100M;
        
        # Увеличиваем таймауты для больших файлов
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        
        proxy_ssl_server_name on;
        proxy_set_header Host r2-uploader.kairatovadil7.workers.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass https://r2-uploader.kairatovadil7.workers.dev/;
    }
    
    # Отключаем кэширование для HTML файлов
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Отключаем кэширование для supabase-config.js и document-renderer.js
    location ~* /js/(supabase-config|document-renderer)\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Кэширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Безопасность: скрываем версию nginx
    server_tokens off;
    
    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}

